name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1
          cache-disabled: true

      - name: Download Xray Core Library
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.30/libv2ray.aar

      - name: Download hev-socks5-tunnel native libraries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64 app/src/main/jniLibs/x86
          curl -L -o /tmp/sockstun.zip https://github.com/heiher/sockstun/releases/download/7.0/sockstun-7.0-android.zip
          unzip -o /tmp/sockstun.zip -d /tmp/sockstun
          cp /tmp/sockstun/arm64-v8a/libhev-socks5-tunnel.so app/src/main/jniLibs/arm64-v8a/
          cp /tmp/sockstun/armeabi-v7a/libhev-socks5-tunnel.so app/src/main/jniLibs/armeabi-v7a/
          cp /tmp/sockstun/x86_64/libhev-socks5-tunnel.so app/src/main/jniLibs/x86_64/
          cp /tmp/sockstun/x86/libhev-socks5-tunnel.so app/src/main/jniLibs/x86/

      - name: Build debug APK
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
