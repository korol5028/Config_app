name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.11.1
          cache-disabled: true

      - name: Download Xray Core Library
        run: |
          mkdir -p app/libs
          curl -L -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.30/libv2ray.aar

      - name: Extract hev-socks5-tunnel native libraries
        run: |
          curl -L -o /tmp/sockstun.apk "https://f-droid.org/repo/hev.sockstun_8.apk"
          unzip -o /tmp/sockstun.apk -d /tmp/sockstun
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64 app/src/main/jniLibs/x86
          cp /tmp/sockstun/lib/arm64-v8a/libhev-socks5-tunnel.so app/src/main/jniLibs/arm64-v8a/
          cp /tmp/sockstun/lib/armeabi-v7a/libhev-socks5-tunnel.so app/src/main/jniLibs/armeabi-v7a/
          cp /tmp/sockstun/lib/x86_64/libhev-socks5-tunnel.so app/src/main/jniLibs/x86_64/
          cp /tmp/sockstun/lib/x86/libhev-socks5-tunnel.so app/src/main/jniLibs/x86/

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace > build.log 2>&1 || (cat build.log && exit 1)

      - name: Build debug APK
        run: gradle clean assembleDebug --no-daemon --stacktrace >> build.log 2>&1 || (cat build.log && exit 1)

      - name: Upload Build Log (Если упало)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK (Если собралось)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
